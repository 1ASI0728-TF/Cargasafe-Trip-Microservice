spring.application.name=trip-service
server.port=8086

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cargasafe_trip
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Integrations
integrations.monitoring-service.base-url=http://localhost:8087
integrations.merchant-service.base-url=http://localhost:8084
